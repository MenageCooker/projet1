# PokéSpread JP→FR — Automated Price Updater
# Runs every 6 hours via GitHub Actions (cron schedule)
# Real sold transactions across Japanese acquisition (PriceCharting / Yuyu-tei)
# and European resale (Cardmarket / PriceCharting / eBay FR)
# Writes verified prices.json and auto-commits to repository

name: Update Pokémon Card Prices

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force full refresh (ignore cache)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update-prices:
    name: Scrape & Update prices.json
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price scraper
        env:
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          python scraper/fetch_prices.py
        continue-on-error: false

      - name: Validate prices.json output
        run: |
          python -c "
          import json, sys
          with open('prices.json', encoding='utf-8') as f:
              data = json.load(f)
          meta = data.get('_meta', {})
          prices = data.get('prices', {})
          total_both = meta.get('total_priced_both', 0)
          fr_only = meta.get('fr_only', 0)
          jp_only = meta.get('jp_only', 0)
          breakers = meta.get('circuit_breakers', {})
          blocked = [k for k, v in breakers.items() if v]
          print('=' * 60)
          print('✅ prices.json validation summary:')
          print(f'   Total Cards in DB: {len(prices)}')
          print(f'   Fully Priced (Both JP & FR): {total_both}')
          print(f'   FR Only: {fr_only}')
          print(f'   JP Only: {jp_only}')
          print(f'   Blocked Sources: {blocked if blocked else \"None\"}')
          print(f'   Generated At: {meta.get(\"generated_at\")}')
          print('=' * 60)
          if not meta.get('generated_at'):
              print('ERROR: missing generated_at')
              sys.exit(1)
          "

      - name: Commit and push prices.json
        run: |
          git config user.name "pokespread-bot[bot]"
          git config user.email "pokespread-bot@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "No changes to prices.json — skipping commit"
          else
            CARD_COUNT=$(python -c "import json; d=json.load(open('prices.json', encoding='utf-8')); print(len(d.get('prices', {})))")
            git commit -m "chore(prices): auto-update ${CARD_COUNT} cards [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git fetch origin main
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main
            echo "✅ prices.json committed and pushed"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Price scraper failed — check GitHub Actions workflow log"
